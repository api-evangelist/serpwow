aid: serpwow
name: SerpWow
description: >-
  SerpWow is a real-time SERP (search engine results page) API from Traject Data. A single
  GET request to https://api.serpwow.com/live returns clean, structured JSON, HTML or CSV
  results from Google, Bing, Yahoo, Baidu, Yandex, Naver, Amazon or eBay, with fine-grained
  control over location (down to ZIP/postal code), device (desktop, tablet, mobile), language,
  country and result type — organic search, Maps places and reviews, Shopping, Product,
  News, Images, Videos, Scholar, Trends, Autocomplete, Reverse Image and Google AI Overviews.
  Alongside the real-time Search API, SerpWow ships a Batches API for scheduling up to 15,000
  searches at a time with webhook or object-storage delivery, a free Locations API, a
  Destinations API that pushes result sets to S3, Google Cloud Storage, Azure Blob or any
  S3-compatible store, an Error Logs API, and an Account API for credit and platform-status
  telemetry. Billing is metered in credits with published per-tier overage rates, and requests
  that do not return HTTP 200 are not charged.
