billing_features:
  - name: Overage
    description: >-
      Overage can be enabled per account so requests beyond the monthly credit allowance are
      billed at the tier's per-credit rate rather than returning HTTP 402.
    source: https://docs.trajectdata.com/serpwow/response-codes
  - name: Account Balance
    description: >-
      A prepaid balance used to pay overage charges, topped up on the Account page of the
      dashboard. It is not used for the monthly plan payment.
    source: https://docs.trajectdata.com/serpwow/account-api
