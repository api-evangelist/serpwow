description: >-
  Published SerpWow plans and pricing, read from the SerpWow product page on 2026-08-27. Prices
  are quoted per month with a monthly/annual toggle; the annual column is a stated 20% discount
  and is billed annually. Every tier is metered in credits, and each tier publishes an explicit
  per-credit overage rate. Replaces the 2026-05-04 scaffold, whose limits were placeholders.
currency: USD
billing_model: subscription-with-metered-overage
metric: credits
plan_count: 5
free_tier: false
free_trial: true
free_trial_url: https://app.serpwow.com/signup
enterprise_contact: https://trajectdata.com/contact-us/
credit_rules:
  - Each successfully retrieved page of results costs one credit.
  - Requests that do not return HTTP 200 are not charged.
  - Batches API, Locations API and Account API calls are free of charge.
  - Each AI Overview returned adds 1 credit to the query cost.
