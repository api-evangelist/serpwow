source: https://docs.trajectdata.com/serpwow/product-updates
description: >-
  SerpWow has no version identifier in its API paths — the single base URL is
  https://api.serpwow.com/live and capability is selected by the `engine` and `search_type`
  query parameters rather than by version. Change is communicated through a dated Product
  Updates page and endpoint-level deprecation notices carried in the documentation titles.
versioning:
  scheme: unversioned
  current: live
  base_url: https://api.serpwow.com/live
  docs: https://docs.trajectdata.com/serpwow/search-api/overview
  note: >-
    `live` is the real-time path segment, not a version. There is no /v1/, no version header and
    no version query parameter documented.
deprecation:
