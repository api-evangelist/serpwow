runtime_incident_signals:
- signal: HTTP 503 with a retry_after body
  description: Returned while a parsing incident is active for the requested result type.
- signal: skip_on_incident request parameter
  description: Opt out of being served data during an active parsing incident.
- signal: Account API status[] array
  description: >-
    GET /live/account returns a `status` array of component/status pairs, so incident state is
    readable in-band without polling the status page.
  docs: https://docs.trajectdata.com/serpwow/account-api
data_retention:
- resource: Batch Result Set
  window: 14 days
  note: Result Sets are available for download for 14 days.
- resource: Batch
  window: 2 months of inactivity
  note: Batches not started for over 2 months are automatically deleted.
- resource: Error Log entry
  window: 3 days
  note: Retention timer resets on each recurrence.
- resource: Account usage history
  window: 3 months
  note: The Account API returns credit usage history for the past 3 months.
